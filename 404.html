<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Page Not Found | AeroSpace</title>
  <link rel="stylesheet" href="404.css" />
</head>
<body>

<div class="container">
    <div class="clouds"></div>

    <h1 class="title">404</h1>
    <p class="subtitle">Oops! This page took a wrong flight path.</p>

    <img src="error img.webp"
         alt="Airplane"
         class="plane" />

    <a href="index.html" class="btn">Go Back Home</a>
</div>

<script src="404.js"></script>
<style>/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(to bottom, #0a1b3f, #102a63);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Poppins", sans-serif;
  color: #fff;
  overflow: hidden;
}

/* MAIN CONTAINER */
.container {
  text-align: center;
  padding: 20px;
  width: 100%;
  max-width: 450px;
  position: relative;
}

/* CLOUDS ANIMATION */
.clouds {
  position: absolute;
  top: -40px;
  left: 0;
  width: 100%;
  height: 130px;
  background: url("clouds.png") repeat-x;
  animation: cloudMove 18s linear infinite;
  opacity: 0.6;
}

@keyframes cloudMove {
  0% { background-position: 0 0; }
  100% { background-position: -1000px 0; }
}

/* TITLE */
.title {
  font-size: 10rem;
  font-weight: 700;
  margin-bottom: 10px;
  animation: pop 0.7s ease-in-out;
}

@keyframes pop {
  0% { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.subtitle {
  font-size: 1.2rem;
  margin-bottom: 25px;
  opacity: 0.9;
}

/* PLANE IMAGE */
.plane {
  width: 280px;
  animation: float 3s ease-in-out infinite;
  margin-bottom: 25px;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-12px) rotate(4deg); }
}

/* BUTTON */
.btn {
  text-decoration: none;
  padding: 12px 25px;
  background: #1e90ff;
  color: #fff;
  border-radius: 30px;
  font-size: 1rem;
  display: inline-block;
  transition: 0.3s ease;
}

.btn:hover {
  background: #0d6efd;
  transform: scale(1.05);
}


/* =======================
    MOBILE RESPONSIVE
========================= */

/* Tablets */
@media (max-width: 768px) {
  .title {
    font-size: 7rem;
  }
  .plane {
    width: 240px;
  }
  .subtitle {
    font-size: 1rem;
  }
}

/* Small mobile devices */
@media (max-width: 480px) {
  .title {
    font-size: 5rem;
  }
  .plane {
    width: 190px;
  }
  .subtitle {
    font-size: 0.9rem;
  }
  .btn {
    padding: 10px 18px;
    font-size: 0.9rem;
  }
}

/* Ultra-small phones */
@media (max-width: 360px) {
  .title {
    font-size: 4rem;
  }
  .plane {
    width: 150px;
  }
}
</style>
<script>// Optional plane tilt on mouse move
document.addEventListener("mousemove", (e) => {
  const plane = document.querySelector(".plane");
  let rotateValue = (e.clientX / window.innerWidth - 0.5) * 20;
  plane.style.transform = `translateY(-5px) rotate(${rotateValue}deg)`;
});
</script>
</body>
</html>
